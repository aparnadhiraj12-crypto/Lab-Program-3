<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Book Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #f6ece9;
      color: #221f1b;
      padding: 50px 46px;
    }
    .welcome {
      max-width: 420px;
      margin: 110px auto 0;
      text-align: center;
      color: #8b8479;
    }
    .welcome .icon { font-size: 30px; margin-bottom: 14px; }
    .welcome h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 25px;
      color: #221f1b;
      margin: 0 0 8px;
    }

    .layout { max-width: 620px; margin: 0 auto; }

    .hero { display: flex; justify-content: center; margin-bottom: 30px; }
    .hero svg { filter: drop-shadow(0 18px 26px rgba(30,20,10,0.22)); }

    h1.title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 30px;
      margin: 0 0 6px;
      text-align: center;
    }
    .author {
      text-align: center;
      font-style: italic;
      color: #8b8479;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .meta {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #a8493f;
      background: #f2d9d6;
      padding: 7px 14px;
      border-radius: 999px;
    }
    .desc {
      background: #fdfbf7;
      border-radius: 18px;
      padding: 26px 30px;
      line-height: 1.8;
      font-size: 15px;
      color: #4a4237;
      box-shadow: 0 16px 30px -18px rgba(30,20,10,0.16);
    }
  </style>
</head>
<body>
  <div id="content" class="welcome">
    <div class="icon">&#128214;</div>
    <h1>Welcome to the Book Library</h1>
    <p>Select a book from the list on the left to see its details here.</p>
  </div>

  <script src="bookdata.js"></script>
  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    var id = getParam('id');
    var book = books.find(function (b) { return String(b.id) === id; });
    var contentEl = document.getElementById('content');

    function openBookSVG(color) {
      return '<svg width="230" height="150" viewBox="0 0 230 150">' +
        '<path d="M8 8 L115 20 L115 138 L8 126 Z" fill="#faf6ef" stroke="#e3dccb"/>' +
        '<path d="M222 8 L115 20 L115 138 L222 126 Z" fill="#faf6ef" stroke="#e3dccb"/>' +
        '<rect x="120" y="24" width="98" height="106" fill="' + color + '" rx="2"/>' +
        '<line x1="115" y1="20" x2="115" y2="138" stroke="#d8cfb8" stroke-width="2"/>' +
        '</svg>';
    }

    if (book) {
      contentEl.className = 'layout';
      contentEl.innerHTML =
        '<div class="hero">' + openBookSVG(book.color) + '</div>' +
        '<h1 class="title">' + book.title + '</h1>' +
        '<div class="author">by ' + book.author + '</div>' +
        '<div class="meta">' +
          '<span>&#128197; ' + book.year + '</span>' +
          '<span>&#128218; ' + book.genre + '</span>' +
          '<span>&#128196; ' + book.pages + ' pages</span>' +
        '</div>' +
        '<div class="desc">' + book.description + '</div>';
    }
  </script>
</body>
</html>
