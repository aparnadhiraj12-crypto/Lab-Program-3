<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Book Info</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #f6ece9;
      color: #221f1b;
      padding: 44px 40px;
    }
    .landing { max-width: 760px; margin: 0 auto; }

    .landing-hero {
      text-align: center;
      padding: 20px 0 40px;
    }
    .landing-hero .eyebrow {
      font-size: 13px;
      color: #a8493f;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .landing-hero h1 {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 36px;
      margin: 0 0 12px;
    }
    .landing-hero p {
      color: #8b8479;
      font-size: 15px;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 28px 0 44px;
    }
    .stat {
      background: #fdfbf7;
      border-radius: 16px;
      padding: 16px 26px;
      text-align: center;
      box-shadow: 0 14px 26px -18px rgba(30,20,10,0.18);
    }
    .stat .num {
      font-family: 'Fraunces', serif;
      font-size: 24px;
      font-weight: 600;
      color: #221f1b;
    }
    .stat .label {
      font-size: 11.5px;
      color: #8b8479;
      margin-top: 2px;
    }

    .browse-heading {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 18px;
      margin: 0 0 18px;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .shelf-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fdfbf7;
      border-radius: 14px;
      padding: 12px;
      text-decoration: none;
      color: #221f1b;
      box-shadow: 0 12px 22px -18px rgba(30,20,10,0.16);
      transition: transform 0.15s;
    }
    .shelf-card:hover { transform: translateY(-3px); }
    .shelf-card .spine {
      width: 34px;
      height: 50px;
      border-radius: 4px;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }
    .shelf-card .spine img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .shelf-card .spine .fallback {
      width: 100%; height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .shelf-card .card-title {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.3;
    }
    .shelf-card .card-author {
      font-size: 11.5px;
      color: #8b8479;
      margin-top: 2px;
    }

    .layout { max-width: 620px; margin: 0 auto; }

    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #8b8479;
      text-decoration: none;
      margin-bottom: 22px;
    }
    .home-btn:hover { color: #a8493f; }

    .hero { display: flex; justify-content: center; margin-bottom: 30px; }
    .cover-large {
      width: 172px;
      height: 254px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      box-shadow: 4px 10px 26px rgba(20,15,5,0.28);
    }
    .cover-large img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-large .fallback {
      width: 100%; height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: #fff;
      font-family: 'Fraunces', serif;
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }
    .cover-large .fallback .emoji { font-size: 34px; }

    h1.title {
      font-family: 'Fraunces', serif;
      font-weight: 500;
      font-size: 30px;
      margin: 0 0 6px;
      text-align: center;
    }
    .author {
      text-align: center;
      font-style: italic;
      color: #8b8479;
      font-size: 15px;
      margin-bottom: 20px;
    }
    .meta {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 26px;
    }
    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #a8493f;
      background: #f2d9d6;
      padding: 7px 14px;
      border-radius: 999px;
    }
    .desc {
      background: #fdfbf7;
      border-radius: 18px;
      padding: 26px 30px;
      line-height: 1.8;
      font-size: 15px;
      color: #4a4237;
      box-shadow: 0 16px 30px -18px rgba(30,20,10,0.16);
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }
    .detail-box {
      background: #fdfbf7;
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 12px 22px -18px rgba(30,20,10,0.14);
    }
    .detail-box .dt-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a8493f;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .detail-box .dt-value {
      font-size: 14.5px;
      font-weight: 600;
      color: #221f1b;
    }
    .stars { color: #d8685f; letter-spacing: 1px; }
    .stars .num { color: #8b8479; font-weight: 500; font-size: 12.5px; margin-left: 4px; }

    .awards-box { grid-column: 1 / -1; }
    .award-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .award-chip {
      font-size: 12px;
      font-weight: 600;
      color: #6b5636;
      background: #f1e4d1;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .no-awards { font-size: 13px; color: #8b8479; font-style: italic; }
  </style>
</head>
<body>
  <div id="content"></div>

  <script src="bookdata.js"></script>
  <script>
    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    var id = getParam('id');
    var book = books.find(function (b) { return String(b.id) === id; });
    var contentEl = document.getElementById('content');

    function renderLanding() {
      contentEl.className = 'landing';
      var totalPages = books.reduce(function (sum, b) { return sum + b.pages; }, 0);
      var genres = new Set(books.map(function (b) { return b.genre; })).size;

      var cards = books.map(function (b) {
        return '<a class="shelf-card" href="bookinfo.html?id=' + b.id + '">' +
          '<div class="spine" style="background:' + b.color + '">' +
            '<img src="https://covers.openlibrary.org/b/isbn/' + b.isbn + '-M.jpg" alt="" ' +
              'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
            '<div class="fallback">' + b.emoji + '</div>' +
          '</div>' +
          '<div><div class="card-title">' + b.title + '</div>' +
          '<div class="card-author">' + b.author + '</div></div>' +
          '</a>';
      }).join('');

      contentEl.innerHTML =
        '<div class="landing-hero">' +
          '<div class="eyebrow">ONLINE LIBRARY</div>' +
          '<h1>Welcome to the Book Library</h1>' +
          '<p>Browse the collection below, or pick a title from the list on the left to read its full details.</p>' +
        '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="num">' + books.length + '</div><div class="label">Books</div></div>' +
          '<div class="stat"><div class="num">' + genres + '</div><div class="label">Genres</div></div>' +
          '<div class="stat"><div class="num">' + totalPages.toLocaleString() + '</div><div class="label">Total pages</div></div>' +
        '</div>' +
        '<h2 class="browse-heading">Browse the collection</h2>' +
        '<div class="shelf-grid">' + cards + '</div>';
    }

    function coverHTML(b) {
      return '<div class="cover-large" style="background:' + b.color + '">' +
        '<img src="https://covers.openlibrary.org/b/isbn/' + b.isbn + '-L.jpg" alt="' + b.title + ' cover" ' +
          'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
        '<div class="fallback"><div class="emoji">' + b.emoji + '</div>' + b.title + '</div>' +
      '</div>';
    }

    function starRating(rating) {
      var full = Math.round(rating);
      var stars = '';
      for (var i = 0; i < 5; i++) stars += i < full ? '\u2605' : '\u2606';
      return '<span class="stars">' + stars + '<span class="num">' + rating.toFixed(1) + ' / 5</span></span>';
    }

    if (book) {
      contentEl.className = 'layout';
      var awardsHTML = book.awards.length
        ? '<div class="award-list">' + book.awards.map(function (a) { return '<span class="award-chip">&#127942; ' + a + '</span>'; }).join('') + '</div>'
        : '<div class="no-awards">No awards on record.</div>';

      contentEl.innerHTML =
        '<a class="home-btn" href="bookinfo.html">&#8592; Back to library</a>' +
        '<div class="hero">' + coverHTML(book) + '</div>' +
        '<h1 class="title">' + book.title + '</h1>' +
        '<div class="author">by ' + book.author + '</div>' +
        '<div class="meta">' +
          '<span>&#128197; ' + book.year + '</span>' +
          '<span>&#128218; ' + book.genre + '</span>' +
          '<span>&#128196; ' + book.pages + ' pages</span>' +
        '</div>' +
        '<div class="desc">' + book.description + '</div>' +
        '<div class="details-grid">' +
          '<div class="detail-box"><div class="dt-label">Rating</div><div class="dt-value">' + starRating(book.rating) + '</div></div>' +
          '<div class="detail-box"><div class="dt-label">Language</div><div class="dt-value">' + book.language + '</div></div>' +
          '<div class="detail-box"><div class="dt-label">Publisher</div><div class="dt-value">' + book.publisher + '</div></div>' +
          '<div class="detail-box"><div class="dt-label">ISBN</div><div class="dt-value">' + book.isbn + '</div></div>' +
          '<div class="detail-box awards-box"><div class="dt-label">Awards</div>' + awardsHTML + '</div>' +
        '</div>';
    } else {
      renderLanding();
    }
  </script>
</body>
</html>
