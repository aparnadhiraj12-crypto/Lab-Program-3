<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Book Info</title>
  <style>
    body {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      background: #f9f7f1;
      color: #2c3e50;
      padding: 30px 40px;
    }
    .welcome {
      text-align: center;
      margin-top: 80px;
      color: #7f8c8d;
    }
    .welcome h1 {
      color: #2c3e50;
    }
    .card {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e0dcd0;
      border-radius: 6px;
      padding: 30px 36px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .cover {
      float: left;
      width: 120px;
      height: 170px;
      margin-right: 24px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      text-align: center;
      padding: 8px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 26px;
    }
    .author {
      font-style: italic;
      color: #7f8c8d;
      margin-bottom: 14px;
    }
    .meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
    }
    .meta span {
      display: inline-block;
      margin-right: 18px;
    }
    .desc {
      clear: left;
      line-height: 1.7;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div id="content" class="welcome">
    <h1>Welcome to the Book Library</h1>
    <p>Select a book from the list on the left to see its details here.</p>
  </div>

  <script src="bookdata.js"></script>
  <script>
    function getParam(name) {
      var params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    var id = getParam('id');
    var book = books.find(function (b) { return String(b.id) === id; });
    var contentEl = document.getElementById('content');

    if (book) {
      contentEl.className = '';
      contentEl.innerHTML =
        '<div class="card">' +
          '<div class="cover" style="background:' + book.color + '">' + book.title + '</div>' +
          '<h1>' + book.title + '</h1>' +
          '<div class="author">by ' + book.author + '</div>' +
          '<div class="meta">' +
            '<span>📅 ' + book.year + '</span>' +
            '<span>📖 ' + book.genre + '</span>' +
            '<span>📄 ' + book.pages + ' pages</span>' +
          '</div>' +
          '<div class="desc">' + book.description + '</div>' +
        '</div>';
    }
  </script>
</body>
</html>
